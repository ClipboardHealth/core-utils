# This file overrides package.json workspace discovery; preserve the local packages.
packages:
  - packages/*

# Keep dependencies in this project's node_modules/.aube instead of aube's per-user store, so
# packages with undeclared peers (dependency-cruiser's TypeScript) resolve this project's copy.
enableGlobalVirtualStore: false

# Dependency build scripts reviewed and intentionally skipped; builds and tests don't need them.
allowBuilds:
  # Downloads Chromium for promptfoo; run `npx playwright install chromium` if needed.
  "@playwright/browser-chromium": false
  # Only verifies the native binding, which optional dependencies already provide.
  "@swc/core": false
  # Runs `pnpm exec playwright install` for Less's own development checkout.
  less: false
  # Downloads optional CUDA binaries for promptfoo's local models.
  onnxruntime-node: false
  # Only warns about version-scheme mismatches.
  protobufjs: false
