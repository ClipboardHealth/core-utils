# Template: copy to .github/workflows/tighten-lint-ceilings.yml and fill in the two marked spots.
#
# Pull requests may shrink a file listed in lint-ceilings.json without lowering its ceiling, so
# ceilings drift above the real values. This lowers them on the default branch each week and opens a PR.
name: Tighten lint ceilings

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

concurrency:
  group: tighten-lint-ceilings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    # Manual runs from other branches would measure unmerged code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, cb-ephemeral-8-cores]
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.tighten.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # FILL IN 1/2: the repository's install steps, e.g. its setup-node composite action. This job
      # holds no write token, so dependency code that runs here cannot push.
      - name: Install
        run: npm ci

      - name: Tighten lint-ceilings.json
        id: tighten
        run: |
          npx cbh-lint-ceilings tighten
          if git diff --quiet -- lint-ceilings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- lint-ceilings.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tighten.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lint-ceilings
          path: lint-ceilings.json
          retention-days: 1

  # Pushes with a write token. It installs and runs no dependency code, so code that ran while
  # measuring cannot reach the token; only lint-ceilings.json crosses over.
  open-pr:
    needs: measure
    if: needs.measure.outputs.changed == 'true'
    runs-on: [self-hosted, cb-ephemeral-2-cores]
    timeout-minutes: 10
    steps:
      # An app token, unlike GITHUB_TOKEN, triggers the PR's required checks.
      - name: Create token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: lint-ceilings
          path: ${{ runner.temp }}/lint-ceilings

      - name: Open or update the PR
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BRANCH: chore/tighten-lint-ceilings
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # FILL IN 2/2: GitHub logins to request reviews from, space-separated.
          REVIEWERS: "reviewer-one reviewer-two"
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Skip hooks and fsmonitor commands an earlier job may have left in this checkout. The
          # token goes through the environment so it is never written to .git/config.
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="core.hooksPath" GIT_CONFIG_VALUE_0="/dev/null"
          export GIT_CONFIG_KEY_1="core.fsmonitor" GIT_CONFIG_VALUE_1="false"
          export GIT_CONFIG_KEY_2="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_2
          cp "$RUNNER_TEMP/lint-ceilings/lint-ceilings.json" lint-ceilings.json
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit --quiet --message "chore: tighten lint-ceilings.json" -- lint-ceilings.json
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "chore: tighten lint-ceilings.json" \
              --body "Lowers each ceiling in \`lint-ceilings.json\` to its file's current value on \`${DEFAULT_BRANCH}\`, and drops entries for files now within the default or deleted. Generated by [\`tighten-lint-ceilings.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Approve it to merge."
          fi
          gh pr merge "$BRANCH" --auto --squash
          # Auto-merge is already on, so a failed request must fail the run. The REST call avoids
          # the org-team lookup older gh versions make for --add-reviewer, which this token can't
          # do. It returns 201 even when it drops a reviewer, so check the response lists them all.
          pr_number=$(gh pr view "$BRANCH" --json number --jq .number)
          read -r -a reviewers <<< "$REVIEWERS"
          reviewer_args=()
          for reviewer in "${reviewers[@]}"; do reviewer_args+=(-f "reviewers[]=${reviewer}"); done
          expected=$(printf '%s\n' "${reviewers[@]}" | jq --raw-input . | jq --slurp --compact-output .)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/requested_reviewers" \
            "${reviewer_args[@]}" \
            --jq "${expected} - [.requested_reviewers[].login]
              | if length > 0 then error(\"Reviewers not requested: \(join(\", \"))\") else empty end"
