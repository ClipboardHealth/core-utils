name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
  # Recovery: restart-release dispatches this when main moves during a release. Also usable by hand.
  workflow_dispatch:

# On main, queue instead of cancelling: a run cancelled after its release push and before
# `nx release publish` leaves tags whose versions never reach npm, and the next run sees nothing to
# bump. GitHub keeps only the newest pending run, which releases everything on main.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}

# Adapted from https://github.com/nrwl/ci/blob/v0.14.0/.github/workflows/nx-cloud-main.yml
env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}

jobs:
  pull-request:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: [self-hosted, cb-ephemeral-2-cores]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          # GitHub checks PRs out based on the merge commit; we want the branch HEAD.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - run: git fetch origin main:main
      - uses: ./.github/actions/setup-node
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
          start_services: "true"
      # `projectsAffectedByDependencyUpdates: auto` narrows what `nx affected` counts for
      # package-lock.json changes, so run everything when the lockfile changed.
      - name: Choose nx affected or run-many
        run: |
          if git diff --quiet "$NX_BASE...$NX_HEAD" -- package-lock.json; then
            echo "CI_NX_COMMAND=affected" >> "$GITHUB_ENV"
          else
            echo "CI_NX_COMMAND=run-many" >> "$GITHUB_ENV"
          fi
      # Don't use the read-write NX_CLOUD_ACCESS_TOKEN when not on `main`, see https://nx.dev/ci/concepts/cache-security#use-a-readwrite-token-in-ci
      - run: node --run verify
      - run: npx nx "$CI_NX_COMMAND" --configuration ci --parallel 8 --targets build,lint,test
      - run: docker compose down --volumes
        if: always()

  main:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: [self-hosted, cb-ephemeral-2-cores]
    timeout-minutes: 15
    # A full re-run uploads a second artifact in the same run, and deploy-pages fails when it finds
    # two with one name. Deploy-only re-runs reuse this output, so they find the original artifact.
    outputs:
      pages-artifact: github-pages-${{ github.run_attempt }}
      superseded: ${{ steps.release.outputs.superseded }}
    steps:
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: ./.github/actions/setup-node
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
          start_services: "true"
      # `projectsAffectedByDependencyUpdates: auto` narrows what `nx affected` counts for
      # package-lock.json changes, so run everything when the lockfile changed.
      - name: Choose nx affected or run-many
        run: |
          if git diff --quiet "$NX_BASE...$NX_HEAD" -- package-lock.json; then
            echo "CI_NX_COMMAND=affected" >> "$GITHUB_ENV"
          else
            echo "CI_NX_COMMAND=run-many" >> "$GITHUB_ENV"
          fi
      # Skip the cache and use the read-write NX_CLOUD_ACCESS_TOKEN on `main`, see https://nx.dev/ci/concepts/cache-security#skip-the-cache-when-creating-a-deployment-artifact
      - run: npx nx "$CI_NX_COMMAND" --configuration ci --skip-nx-cache --target build
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Lint and test can use the cache; only build needs --skip-nx-cache for deployment artifact integrity
      - run: npx nx "$CI_NX_COMMAND" --configuration ci --targets lint,test
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      - run: docker compose down --volumes
        if: always()

      - run: |
          git config user.name "GitHub Bot"
          git config user.email "open-source@clipboardhealth.com"
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NX_RELEASE: true
        id: release
        # Version package.json files at project roots
        run: npx tsx scripts/release.ts
        # Run a build so package.json files in dist directories pick up new versions
      - run: npx nx run-many --target=build
      - env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          # Skip ts-node/esm loader registration; with a workspace-root tsconfig.json,
          # ts-node@11.0.0-beta.1 crashes resolving package-name `extends`.
          NX_PREFER_NODE_STRIP_TYPES: "true"
        # Re-publishing an existing version is a no-op, so re-running this workflow recovers from transient NPM registry failures
        run: npx nx release publish
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        # Commit mismatched package.json versions and package-lock.json changes, if any. Main runs
        # aren't cancelled, so main may have moved since checkout; the next main run syncs then.
        run: |
          npx syncpack fix
          npm install
          git add package.json packages/*/package.json package-lock.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(release): sync package versions [skip actions]" --no-verify
          if ! git push --no-verify; then
            git fetch --quiet origin main
            # Exit status 1 alone means main moved; 0 means it didn't, and anything else is an error.
            ancestor_status=0
            git merge-base --is-ancestor FETCH_HEAD HEAD || ancestor_status=$?
            if [ "$ancestor_status" -ne 1 ]; then
              exit 1
            fi
            echo "::warning::main moved during this run, so the package version sync wasn't pushed. The next main run syncs them."
          fi
      - run: node --run docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

  # release.ts found main moved before its push, so that run pushed and published nothing. A merge
  # whose message contains a skip keyword starts no CI run of its own, so start one here.
  restart-release:
    needs: [main]
    if: failure() && needs.main.outputs.superseded == 'true'
    permissions:
      actions: write
    runs-on: [self-hosted, cb-ephemeral-2-cores]
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy-docs:
    needs: [main]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: [self-hosted, cb-ephemeral-2-cores]
    timeout-minutes: 10
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.main.outputs.pages-artifact }}
