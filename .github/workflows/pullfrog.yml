# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node for private review policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Create private-skills read token
        id: private_skills_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: skills-private
          permission-contents: read
      - name: Fetch pinned review skill
        id: review_skill
        env:
          GH_TOKEN: ${{ steps.private_skills_token.outputs.token }}
          PRIVATE_SKILLS_COMMIT: "6b1bc7cad373707e99639a5ad173baeb5c86f391"
        run: node .github/pullfrog/skill.mjs prepare "$PRIVATE_SKILLS_COMMIT"
      - name: Revoke private-skills token
        if: ${{ always() && steps.private_skills_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.private_skills_token.outputs.token }}
        run: gh api --method DELETE /installation/token
      - name: Install review skill without host credentials
        id: install_review_skill
        env:
          REVIEW_SKILL_ROOT: ${{ steps.review_skill.outputs.root }}
          MANIFEST_SHA256: ${{ steps.review_skill.outputs.manifest_sha256 }}
        run: node "$REVIEW_SKILL_ROOT/skill.mjs" install "$REVIEW_SKILL_ROOT" "$MANIFEST_SHA256"
      - name: Protect review policy from native agent writes
        env:
          REVIEW_SKILL_ROOT: ${{ steps.review_skill.outputs.root }}
        run: |
          sudo bash .github/pullfrog/protect.sh "$REVIEW_SKILL_ROOT"
          node .github/pullfrog/protectionProbe.mjs "$REVIEW_SKILL_ROOT"
      - name: Run agent
        uses: pullfrog/pullfrog@22442cbbe9039fe186e20f1fdf9206bb4a07e7cd # v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          PULLFROG_AGENT: opencode
          OPENCODE_CONFIG: ${{ steps.review_skill.outputs.config }}
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>

          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for Azure OpenAI (https://docs.pullfrog.com/azure)
          # AZURE_RESOURCE_NAME is the <name> in https://<name>.openai.azure.com
          # AZURE_DEPLOYMENT is your deployment's name, not the model it serves
          # AZURE_RESOURCE_NAME: my-resource
          # AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          # AZURE_DEPLOYMENT: <deployment-name>
          # both limits are required — set them to the real limits of that model
          # AZURE_CONTEXT: "400000"
          # AZURE_MAX_OUTPUT: "128000"

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
          # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # OPENAI_COMPATIBLE_MODEL: <model-id>
          # both limits are required — set them to the real limits of that model
          # OPENAI_COMPATIBLE_CONTEXT: "128000"
          # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
      - name: Verify review policy integrity
        if: ${{ always() && steps.install_review_skill.outcome == 'success' }}
        env:
          REVIEW_SKILL_ROOT: ${{ steps.review_skill.outputs.root }}
          SCRIPT_SHA256: ${{ steps.review_skill.outputs.script_sha256 }}
          MANIFEST_SHA256: ${{ steps.review_skill.outputs.manifest_sha256 }}
        run: |
          printf '%s  %s\n' "$SCRIPT_SHA256" "$REVIEW_SKILL_ROOT/skill.mjs" | sha256sum --check --status
          node "$REVIEW_SKILL_ROOT/skill.mjs" verify "$REVIEW_SKILL_ROOT" "$MANIFEST_SHA256"
